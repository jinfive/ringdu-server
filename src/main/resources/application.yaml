spring:
  application:
    name: ringdu-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ringdu}
    username: ${DB_USERNAME:ringdu}
    password: ${DB_PASSWORD:ringdu1234}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8081}

jwt:
  # 운영 환경에서는 반드시 환경변수 JWT_SECRET으로 분리한다.
  secret: ${JWT_SECRET:ringdu-local-development-secret-key-must-be-changed-in-production-2026}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  used-refresh-token-ttl: ${JWT_USED_REFRESH_TOKEN_TTL:14d}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  cookie:
    # localhost 개발 환경에서는 false, 운영 HTTPS 환경에서는 true로 설정한다.
    secure: ${COOKIE_SECURE:false}
