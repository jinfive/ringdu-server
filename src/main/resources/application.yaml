spring:
  application:
    name: ringdu-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ringdu}
    username: ${DB_USERNAME:ringdu}
    password: ${DB_PASSWORD:ringdu1234}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8081}
