spring:
  datasource:
    url: jdbc:h2:mem:ringdu-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: ringdu-test-secret-key-must-be-long-enough-for-hmac-sha
  access-token-ttl: 30m
  refresh-token-ttl: 14d
  used-refresh-token-ttl: 14d
